{% extends 'admin_base.html' %} 

{% block content %}
<div class="container-fluid mt-4">
    <div class="card shadow">
        <div class="card-header py-3">
            <h4 class="m-0 font-weight-bold text-primary">
                <i class="fa fa-edit"></i> Edit Student Info
            </h4>
        </div>
        <div class="card-body">
            {% if messages %}
                {% for message in messages %}
                <div class="alert alert-success alert-dismissible fade show" role="alert">
                    {{ message }}
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>
                {% endfor %}
            {% endif %}

            <form method="post" action="">
                {% csrf_token %}
                
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Full Name</label>
                        <input type="fullname" class="form-control" name="fullname" placeholder="Enter Name" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Roll ID</label>
                        <input type="rollid" class="form-control" name="rollid" placeholder="Enter Roll ID" required>
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label">Email ID</label>
                    <input type="email" class="form-control" name="emailid" placeholder="email@example.com" required>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label d-block">Gender</label>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" name="gender" value="Male" id="male" required>
                            <label class="form-check-label" for="male">Male</label>
                        </div>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" name="gender" value="Female" id="female">
                            <label class="form-check-label" for="female">Female</label>
                        </div>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Date of Birth</label>
                        <input type="date" class="form-control" name="dob" required>
                    </div>
                </div>



                <div class="mb-3">
                   <label class="form-label">Status</label>
                   <select name="status" class="form-control">
                        <option value="1">Active</option>
                        <option value="0">Inactive</option>
                   </select>
                  </div>

                  
                <div class="mb-4">
                    <label class="form-label">Select Semester</label>
                    <select class="form-select" name="semester" required>
                        <option value="">-- Choose Semester --</option>
                        {% for i in semester %}
                            <option value="{{ i.id }}">{{ i.semester_name }} - {{ i.academic_year }}</option>
                        {% empty %}
                            <option disabled>Database me koi data nahi hai</option>
                        {% endfor %}
                    </select>
                </div>

                <hr>

                <div class="mt-4 mb-4">
                    <button type="submit" class="btn btn-success btn-lg px-5">
                        <i class="fa fa-save"></i> Submit
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<div style="height: 100px;"></div>

{% endblock %}
