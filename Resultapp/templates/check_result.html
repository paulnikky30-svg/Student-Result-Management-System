<!DOCTYPE html>
<html>
<head>
    <title>Check Result</title>
</head>

<body>

<div style="margin-left:220px; padding:20px;">

    <h2 style="text-align:center;">Student Results</h2>

    <table border="1" style="width:80%; margin:auto; text-align:center; border-collapse:collapse;">

        <tr>
            <th>Roll No</th>
            <th>Course</th>
            <th>Marks</th>
        </tr>

        {% for r in results %}
        <tr>
            <td>{{ r.roll_no }}</td>
            <td>{{ r.course }}</td>
            <td>{{ r.marks }}</td>
        </tr>
        {% empty %}
        <tr>
            <td colspan="3">No results found</td>
        </tr>
        {% endfor %}

    </table>

</div>

</body>
</html>
