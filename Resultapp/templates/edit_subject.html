{% extends 'admin_base.html' %} 
{% block content %}

<div class="container mt-5">
    <div class="row">
        <div class="col-md-8 offset-md-2">
            <div class="card shadow">
                <div class="card-header bg-primary text-white">
                    <h3><i class="fas fa-book"></i> Edit Subject</h3>
                </div>
                <div class="card-body">
                    
                    <form method="post">
                        {% csrf_token %}

                        <div class="mb-3">
                            <label class="form-label">Subject Name</label>
                            <input type="text" class="form-control" name="subjectname" 
                                   value="{{ subject.subject_name }}" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Subject Code</label>
                            <input type="text" class="form-control" name="subjectcode" 
                                   value="{{ subject.subject_code }}" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Academic Year</label>
                            <input type="text" class="form-control" name="academicyear" 
                                   value="{{ subject.academic_year }}" required>
                        </div>

                        <div class="mt-4">
                            <button type="submit" class="btn btn-success">
                                <i class="fas fa-save"></i> Update Subject
                            </button>
                            <a href="{% url 'manage_subject' %}" class="btn btn-secondary">Cancel</a>
                        </div>
                        
                    </form>

                </div>
            </div>
        </div>
    </div>
</div>

{% endblock %}
