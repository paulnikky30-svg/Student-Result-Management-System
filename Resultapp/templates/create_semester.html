{% extends 'admin_base.html' %}
{% block content %}

<div class="container">
    <h2 class="mb-4"><i class="fas fa-plus-circle"></i>Create Semester</h2>

{% if messages %}
    {% for m in messages %}
        <div class="alert alert-success alert-dismissible fade show" role="alert" style="background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; padding: 15px 50px 15px 15px; margin-bottom: 20px; border-radius: 4px; position: relative; display: flex; align-items: center; justify-content:建设-between;">
            <div>
                <strong>Success!</strong> {{ m }}
            </div>
            <button type="button" data-bs-dismiss="alert" aria-label="Close" style="position: absolute; right: 15px; top: 0; bottom: 0; margin: auto; background: none; border: none; font-size: 28px; cursor: pointer; color: #155724; display: flex; align-items: center; height: 100%;">&times;</button>
        </div>
    {% endfor %}
{% endif %}

    <form method="post">
        {% csrf_token %}
        <div class="mb-3">
            <label for="semestername" class="form-label"> Semester Name</label>
            <input type="text" class="form-control" id="semestername" name="semestername" required  >
        </div>

         <div class="mb-3">
            <label for="semestercode" class="form-label"> Semester Code</label>
            <input type="text" class="form-control" id="semestercode" name="semestercode" required  >
        </div>

         <div class="mb-3">
            <label for="academicyear" class="form-label"> Adademic Year</label>
            <input type="text" class="form-control" id="academicyear" name="academicyear" required  >
        </div>

        <button type="submit" class="btn btn-success">
            <i class=""></i> Submit

        </button>
    </form>
</div>

{% endblock %}
